<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D1D22"/>
      <stop offset="100%" stop-color="#141417"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAAD3F"/>
      <stop offset="50%" stop-color="#F38020"/>
      <stop offset="100%" stop-color="#D96512"/>
    </linearGradient>
  </defs>
  <!-- Squircle Container (exact match to xPrivacyGuard) -->
  <rect x="4" y="4" width="100" height="100" rx="22" fill="url(#bgGrad)" stroke="#2E2E36" stroke-width="2.4"/>
  <!-- Upper Sync Arc + Arrowhead -->
  <path d="M 27 49 A 27 27 0 0 1 76.5 39" fill="none" stroke="url(#accentGrad)" stroke-width="8.5" stroke-linecap="round"/>
  <polygon points="83,46 66,42 79,28" fill="#FAAD3F"/>
  <!-- Lower Sync Arc + Arrowhead -->
  <path d="M 81 59 A 27 27 0 0 1 31.5 69" fill="none" stroke="url(#accentGrad)" stroke-width="8.5" stroke-linecap="round"/>
  <polygon points="25,62 42,66 29,80" fill="#D96512"/>
  <!-- Center Storage Drive Core -->
  <rect x="40" y="45" width="28" height="18" rx="4.5" fill="url(#accentGrad)"/>
  <rect x="44" y="51.5" width="10" height="5" rx="2" fill="#141417"/>
  <circle cx="62" cy="54" r="2.7" fill="#141417"/>
</svg>
